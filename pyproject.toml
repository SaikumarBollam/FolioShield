[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folioshield"
version = "1.1.0"
description = "Hotel chargeback defense & evidence management"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "streamlit[pdf]>=1.35.0",
    "pandas>=2.2.0",
    "pdfplumber>=0.11.0",
    "pypdf>=4.2.0",
    "reportlab>=4.2.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.3.0",
    "cryptography>=42.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
]

[tool.setuptools]
packages = ["core", "core.integrations", "ui", "embedded", "agent", "data"]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.8",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
]
server = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]
db = [
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "test_artifacts",
    "data/demo_integrations",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
]
ignore = [
    "E501",
    "F841",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "^\\.venv",
    "^test_artifacts",
    "^build",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["core", "ui", "agent", "embedded"]
omit = [
    "*/tests/*",
    "*/test_artifacts/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.folioshield]
# Canonical dependency list lives in [project.dependencies] above;
# requirements.txt mirrors it for plain-pip installs (a test asserts parity).
