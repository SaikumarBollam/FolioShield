# FolioShield Commercial Multi-Tenant Deployment.
# Usage:
#   cp .env.example .env
#   docker compose up -d
#
# Services included:
#   - postgres: Primary relational database (SQLAlchemy models + Alembic migrations)
#   - minio: S3-compatible object store for durable evidence exhibits
#   - api: Production FastAPI ASGI server (uvicorn)
#   - ui: Streamlit human reviewer dashboard
services:
  postgres:
    image: postgres:16-alpine
    container_name: folioshield-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-folioshield}
      POSTGRES_USER: ${POSTGRES_USER:-folioshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-folioshield_dev_secret}
    ports:
      - "5432:5432"
    volumes:
      - folioshield-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-folioshield} -d ${POSTGRES_DB:-folioshield}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: folioshield-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-folioshield_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-folioshield_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - folioshield-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  api:
    build: .
    container_name: folioshield-api
    command: ["python", "-m", "uvicorn", "core.api_asgi:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-folioshield}:${POSTGRES_PASSWORD:-folioshield_dev_secret}@postgres:5432/${POSTGRES_DB:-folioshield}
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-folioshield_admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-folioshield_minio_secret}
    volumes:
      - folioshield-data:/app/data
      - folioshield-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build: .
    container_name: folioshield-ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-folioshield}:${POSTGRES_PASSWORD:-folioshield_dev_secret}@postgres:5432/${POSTGRES_DB:-folioshield}
    volumes:
      - folioshield-data:/app/data
      - folioshield-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  folioshield-postgres:
  folioshield-minio:
  folioshield-data:
  folioshield-logs:
